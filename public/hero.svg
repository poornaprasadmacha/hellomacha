<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration: HelloMacha guides</title>
  <rect width="1200" height="600" fill="#ffffff" />
  <g transform="translate(80,100)">
    <!-- stylized tablet -->
    <rect x="0" y="0" width="520" height="320" fill="#fbfbfb" stroke="#e6e6e6" />
    <rect x="18" y="18" width="484" height="40" rx="4" fill="var(--brand-red)" />
    <rect x="18" y="72" width="220" height="16" fill="#222" fill-opacity="0.9" />
    <rect x="18" y="100" width="448" height="160" fill="#ffffff" stroke="#e6e6e6" />

    <!-- stacked cards on right -->
    <g transform="translate(560,8)">
      <rect x="0" y="24" width="420" height="120" fill="#ffffff" stroke="#e6e6e6" />
      <text x="24" y="64" font-family="Manrope, Arial" font-weight="700" font-size="28" fill="#1b1b1b">Top guides for everyday decisions</text>
      <text x="24" y="100" font-family="Manrope, Arial" font-size="16" fill="#707070">Actionable guides and straightforward reviews.</text>
    </g>
  </g>
</svg>